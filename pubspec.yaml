name: stroke_rehab_app
description: Real-time Exercise Quality Classification for Stroke Rehabilitation using IMU sensors and Random Forest AI.
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.1.0 <4.0.0'
  flutter: '>=3.13.0'

dependencies:
  flutter:
    sdk: flutter

  # BLE communication with ESP32
  flutter_blue_plus: ^1.32.12

  # ONNX Runtime — runs the Random Forest model on-device
  onnxruntime: ^1.4.1

  # State management
  provider: ^6.1.2

  # Persistent storage (session history)
  shared_preferences: ^2.3.2

  # BLE & location permissions
  permission_handler: ^11.3.1

  # Haptic feedback
  vibration: ^2.0.0

  # Better datetime formatting
  intl: ^0.19.0

  # JSON serialisation helpers
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/models/
    - assets/config/

